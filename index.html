<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>תרגול בכימיה - מבנה האטום והטבלה המחזורית</title>
    <style>
        :root {
            --primary-color: #2b5c8f;
            --secondary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --warning-color: #f39c12;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            min-height: 580px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--secondary-color);
            transition: width 0.3s ease;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background-color: #fff;
            -webkit-appearance: none;
        }

        .start-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-grow: 1;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            transition: background 0.2s;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active {
            opacity: 0.8;
            background-color: var(--secondary-color);
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            text-align: right;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.3;
            touch-action: manipulation;
        }

        .option-btn.correct {
            border-color: var(--success-color);
            background-color: #e8f8f0;
            color: #1e7e34;
            font-weight: bold;
        }

        .option-btn.incorrect {
            border-color: var(--error-color);
            background-color: #fdeaea;
            color: #b94a48;
            opacity: 0.7;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
            line-height: 1.3;
        }

        .feedback-box.hint {
            background-color: #fef9e7;
            border: 1px solid var(--warning-color);
            color: #7d5a29;
        }

        .feedback-box.success {
            background-color: #e8f8f0;
            border: 1px solid var(--success-color);
            color: #1e7e34;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            flex-grow: 1;
        }

        .screen.active {
            display: flex;
        }

        .results-container {
            text-align: center;
            margin: auto 0;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--secondary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            margin: 20px auto;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--secondary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <!-- מסך פתיחה -->
    <div id="start-screen" class="screen active">
        <div class="start-container">
            <div class="header">
                <h1>תרגול כימיה - כיתה ח'</h1>
                <p>הכנה למבחן: אטום, הטבלה המחזורית ושינויים בחומר</p>
            </div>
            <div style="margin: auto 0;">
                <div class="form-group">
                    <label for="student-name">שם מלא:</label>
                    <input type="text" id="student-name" placeholder="הכנס שם פרטי ומשפחה" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="student-class">כיתה:</label>
                    <select id="student-class">
                        <option value="">בחר כיתה...</option>
                        <option value="ח1">ח'1</option>
                        <option value="ח2">ח'2</option>
                    </select>
                </div>
            </div>
            <button class="btn" id="start-btn" type="button">התחל תרגול</button>
        </div>
    </div>

    <!-- מסך שאלות -->
    <div id="quiz-screen" class="screen">
        <div class="header">
            <span id="question-count" style="font-size: 0.85rem; color: #666;">שאלה 1 מתוך 20</span>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
        <div class="question-title" id="question-text">טוען שאלה...</div>
        <div class="options-container" id="options-container"></div>
        
        <div id="feedback-box" class="feedback-box"></div>

        <button class="btn" id="action-btn" type="button" style="margin-top: 15px; display: none;">המשך לשאלה הבאה</button>
    </div>

    <!-- מסך סיום -->
    <div id="result-screen" class="screen">
        <div class="results-container">
            <h2>כל הכבוד!</h2>
            <p>סיימת את התרגול למבחן בהצלחה.</p>
            <div class="score-circle" id="score-display">0</div>
            <p id="status-message">שולח את התוצאות לגיליון...</p>
            <div id="loader" class="loader"></div>
        </div>
    </div>

</div>

<script>
    // מערך השאלות עם חלוקה שווה מראש (5 פעמים לכל מיקום) + ערבוב אקראי בכל הפעלה
    const rawQuestions = [
        // 1 (מיקום 0 - א')
        {
            q: "איזה חלקיק יסודי באטום נושא מטען חשמלי שלילי ונע בענן סביב הגרעין?",
            options: ["אלקטרון", "פרוטון", "ניוטרון", "גרעין"],
            correct: 0,
            hint: "💡 **רמז:** החלקיק הכבד נמצא בגרעין, ואילו החלקיק הקל והשלילי מקיף אותו."
        },
        // 2 (מיקום 1 - ב')
        {
            q: "מה נמצא בתוך גרעין האטום?",
            options: ["אלקטרונים בלבד", "פרוטונים וניוטרונים", "פרוטונים ואלקטרונים", "ניוטרונים ואלקטרונים"],
            correct: 1,
            hint: "💡 **רמז:** הגרעין מכיל חלקיק טעון חיובית וחלקיק ניטרלי (ללא מטען)."
        },
        // 3 (מיקום 2 - ג')
        {
            q: "מה קובע את המספר האטומי של יסוד?",
            options: ["מספר האלקטרונים בלבד", "מספר הניוטרונים בגרעין", "מספר הפרוטונים בגרעין", "המשקל הכולל של האטום"],
            correct: 2,
            hint: "💡 **רמז:** זהו 'מספר התעודת זהות' של האטום, לפי כמות החלקיקים החיוביים שלו."
        },
        // 4 (מיקום 3 - ד')
        {
            q: "אטום ניטרלי (ניטרלי מבחינה חשמלית) מתאפיין בכך ש:",
            options: ["אין לו אלקטרונים כלל", "מספר הניוטרונים שלו שווה למספר הפרוטונים", "הוא אינו מכיל גרעין", "מספר הפרוטונים שלו שווה למספר האלקטרונים"],
            correct: 3,
            hint: "💡 **רמז:** כדי שהמטען הכולל יהיה 0, המטען החיובי והשלילי חייבים לאזן זה את זה."
        },
        // 5 (מיקום 0 - א')
        {
            q: "כיצד מסודרים היסודות בטבלה המחזורית?",
            options: ["לפי מספר אטומי עולה", "לפי א-ב של שם היסוד", "לפי סדר גילוי היסוד בטבע", "לפי מצב הצבירה שלהם בטמפרטורת החדר"],
            correct: 0,
            hint: "💡 **רמז:** הסדר נקבע לפי כמות הפרוטונים הגדלה מ-1 והלאה."
        },
        // 6 (מיקום 1 - ב')
        {
            q: "מה מאפיין את היסודות השייכים למשפחת ה'מתכות האלקליות'?",
            options: ["הן גזים שאינם מגיבים עם חומרים אחרים", "הן מתכות רכות המגיבות בעוצמה רבה עם מים", "הן אל-מתכות המשמשות לחיטוי", "הן נוזליות בטמפרטורת החדר"],
            correct: 1,
            hint: "💡 **רמז:** מדובר במשפחה 1 בטבלה, הידועה בפעילות הכימית הנמרצת שלה."
        },
        // 7 (מיקום 2 - ג')
        {
            q: "איזו משפחה כימית ידועה בכך שחבריה הם גזים יציבים מאוד ואינם נוטים ליצור תרכובות?",
            options: ["הלוגנים", "מתכות אלקליות", "גזים אצילים", "מתכות מעבר"],
            correct: 2,
            hint: "💡 **רמז:** השם שלהם מרמז על כך שהם 'מורמים מעם' ולא מתחברים לאחרים."
        },
        // 8 (מיקום 3 - ד')
        {
            q: "לאיזו משפחה כימית שייכים היסודות כלור (Cl), ברום (Br) ויוד (I)?",
            options: ["גזים אצילים", "מתכות אלקליות", "מתכות מעבר", "הלוגנים"],
            correct: 3,
            hint: "💡 **רמז:** משפחה זו ממוקמת בטור ה-7 של הטבלה המחזורית והם אל-מתכות פעילות מאוד."
        },
        // 9 (מיקום 0 - א')
        {
            q: "מה מייצגת הנוסחה הכימית H₂O?",
            options: ["שני אטומים של מימן ואטום אחד של חמצן", "אטום אחד של מימן ושני אטומים של חמצן", "שתי מולקולות של מים ומימן אחד", "תרכובת של פחמן וחמצן"],
            correct: 0,
            hint: "💡 **רמז:** המספר הקטן 2 מופיע מיד לאחר האות H (מימן)."
        },
        // 10 (מיקום 1 - ב')
        {
            q: "כיצד נרשום בשפה הכימית 3 מולקולות של גז חמצן (המופיע כזוג אטומים O₂)?",
            options: ["O₆", "3O₂", "(O₂)³", "3O"],
            correct: 1,
            hint: "💡 **רמז:** מספר המולקולות נכתב כמספר גדול לפני הנוסחה של המולקולה."
        },
        // 11 (מיקום 2 - ג')
        {
            q: "מה הפירוש של הסימון הכימי 2CO₂?",
            options: ["מולקולה אחת המורכבת משני אטומי פחמן ושני אטומי חמצן", "שני אטומי פחמן וארבע מולקולות חמצן", "שתי מולקולות שכל אחת מורכבת מאטום פחמן אחד ושני אטומי חמצן", "תערובת של פחמן ומים"],
            correct: 2,
            hint: "💡 **רמז:** המקדם 2 מורה על כמות המולקולות, ו-CO₂ היא מולקולת פחמן דו-חמצני."
        },
        // 12 (מיקום 3 - ד')
        {
            q: "מה מייצג האות הגדולה והאות הקטנה בסימול יסוד כמו Na (נתרן) או Cl (כלור)?",
            options: ["שני יסודות שונים המחוברים יחד", "מולקולה המורכבת משני אטומים", "שינוי מצב צבירה", "יסוד יחיד שסימולו מורכב בשל שמות שמתחילים באותה אות"],
            correct: 3,
            hint: "💡 **רמז:** אות גדולה שאחריה אות קטנה מסמלת אטום של יסוד **אחד** בלבד (כדי לא לבלבל עם C-פחמן)."
        },
        // 13 (מיקום 0 - א')
        {
            q: "מה מתרחש במהלך שינוי פיזיקלי בחומר?",
            options: ["חל שינוי בצורה או במצב הצבירה, אך מולקולות החומר אינן משתנות", "נוצר חומר חדש בעל תכונות שונות", "האטומים נהרסים ונעלמים", "נפלט תמיד גז שמשנה את הרכב החומר"],
            correct: 0,
            hint: "💡 **רמז:** חשיבה על היתוך קרח מים – האם המים הפכו לחומר אחר?"
        },
        // 14 (מיקום 1 - ב')
        {
            q: "איזה מהתהליכים הבאים הוא דוגמה לשינוי כימי?",
            options: ["המסת סוכר במים", "חלודה (התחמצנות) של ברזל", "שבירת כוס זכוכית", "הקפאת מים לקוביות קרח"],
            correct: 1,
            hint: "💡 **רמז:** חפש תהליך שבו נוצר חומר חדש עם צבע ותכונות שונות שאינו חוזר בקלות לקדמותו."
        },
        // 15 (מיקום 2 - ג')
        {
            q: "מה מהבאים מהווה סימן מובהק להתרחשותו של שינוי כימי (תגובה כימית)?",
            options: ["שינוי בצורת החומר עקב גזירה", "שינוי נפח עקב מעבר ממוצק לנוזל", "שינוי צבע פתאומי, פליטת גז או שינוי טמפרטורה בלתי מוכר", "הזזת החומר ממקום למקום"],
            correct: 2,
            hint: "💡 **רמז:** בתגובה כימית נוצר חומר חדש, דבר המלווה לעיתים קרובות בתופעות כמו בועות או חום."
        },
        // 16 (מיקום 3 - ד')
        {
            q: "שריפה של נייר היא דוגמה ל:",
            options: ["שינוי פיזיקלי בלבד", "תהליך של היתוך", "שינוי מצב צבירה", "שינוי כימי, מכיוון שהנייר הופך לפחם, אפר וגזים"],
            correct: 3,
            hint: "💡 **רמז:** האם ניתן להחזיר את האפר והעשן בחזרה לנייר כפי שהיה?"
        },
        // 17 (מיקום 0 - א')
        {
            q: "אם באטום מסוים יש 6 פרוטונים ו-6 אלקטרונים, והוא קולט עוד אלקטרון אחד, מה יקרה למטענו?",
            options: ["יהפוך למטען שלילי (-1)", "יישאר 0 (ניטרלי)", "יהפוך למטען חיובי (+1)", "המטען ישתנה ל-+6"],
            correct: 0,
            hint: "💡 **רמז:** אלקטרונים נושאים מטען שלילי. תוספת של שלילי מטה את הכף."
        },
        // 18 (מיקום 1 - ב')
        {
            q: "מה ההבדל בין תערובת לתרכובת?",
            options: ["בתערובת יש רק מתכות, ובתרכובת יש רק גזים", "בתרכובת יש קשרים כימיים בין היסודות ונוצר חומר חדש, בתערובת החומרים רק מעורבבים פיזית", "אין שום הבדל, אלו שמות נרדפים", "תרכובת ניתן להפריד בקלות ע\"י סינון פיזי"],
            correct: 1,
            hint: "💡 **רמז:** סלט פירות הוא תערובת (הפירות שומרים על תכונותיהם), מים הם תרכובת."
        },
        // 19 (מיקום 2 - ג')
        {
            q: "חומר נתון עבר תהליך שבו נפלט חום רב, נוצרו בועות גז וצבעו השתנה מלבן לחום-שחור. איזה תהליך התרחש?",
            options: ["שינוי פיזיקלי בלבד", "התאדות", "שינוי כימי", "התכה"],
            correct: 2,
            hint: "💡 **רמז:** הופיעו סימנים מובהקים ליצירת חומרים חדשים."
        },
        // 20 (מיקום 3 - ד')
        {
            q: "היכן בטבלה המחזורית נמצא בעיקר את האל-מתכות?",
            options: ["בצד שמאל של הטבלה", "במרכז הטבלה בלבד", "בתחתית הטבלה בשורות הנפרדות", "בצד ימין של הטבלה (למעט מימן)"],
            correct: 3,
            hint: "💡 **רמז:** מתכות תופסות את רוב צד שמאל והמרכז, בעוד האל-מתכות מרוכזות בצד השני."
        }
    ];

    let questions = [];
    let currentQuestion = 0;
    let attempts = 0;
    let studentData = { name: '', class: '', score: 0, answers: [] };

    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmhCvZJdD1HLvR3O-rYLnnI1YQJcnyIA0HjH-S2mRq/dev';

    // פונקציה לערבוב אקראי (Fisher-Yates Shuffle) של אפשרויות התשובה לכל שאלה
    function prepareShuffledQuestions() {
        questions = rawQuestions.map(item => {
            const correctAnswerText = item.options[item.correct];
            // יצירת עותק של האפשרויות וערבובן
            const shuffledOptions = [...item.options];
            for (let i = shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
            }
            // מציאת האינדקס החדש של התשובה הנכונה
            const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
            
            return {
                q: item.q,
                options: shuffledOptions,
                correct: newCorrectIndex,
                hint: item.hint
            };
        });
    }

    window.onload = function() {
        const startBtn = document.getElementById('start-btn');
        const actionBtn = document.getElementById('action-btn');

        function bindFastClick(element, handler) {
            let touched = false;
            
            element.addEventListener('touchstart', function(e) {
                touched = true;
                handler(e);
            }, { passive: false });

            element.addEventListener('click', function(e) {
                if (!touched) {
                    handler(e);
                }
                touched = false;
            });
        }

        bindFastClick(startBtn, startQuiz);
        bindFastClick(actionBtn, handleNextStep);
    };

    function startQuiz(event) {
        if (event && event.preventDefault) {
            event.preventDefault();
        }
        
        const nameInput = document.getElementById('student-name');
        const classSelect = document.getElementById('student-class');
        
        const name = nameInput.value.trim();
        const studentClass = classSelect.value;

        if (!name || !studentClass) {
            alert('אנא מלא את השם והכיתה לפני שתתחיל.');
            return;
        }

        nameInput.blur();
        classSelect.blur();

        studentData.name = name;
        studentData.class = studentClass;

        // ערבוב התשובות לפני תחילת התרגול
        prepareShuffledQuestions();

        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        
        loadQuestion();
    }

    function loadQuestion() {
        attempts = 0;
        const q = questions[currentQuestion];
        
        document.getElementById('question-count').innerText = `שאלה ${currentQuestion + 1} מתוך ${questions.length}`;
        document.getElementById('progress-bar').style.width = `${((currentQuestion) / questions.length) * 100}%`;
        document.getElementById('question-text').innerText = q.q;

        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.style.display = 'none';
        feedbackBox.className = 'feedback-box';

        document.getElementById('action-btn').style.display = 'none';

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.type = 'button';
            btn.innerText = opt;
            btn.id = `opt-${idx}`;
            
            btn.onclick = function() { checkAnswer(idx); };
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex) {
        const q = questions[currentQuestion];
        const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
        const feedbackBox = document.getElementById('feedback-box');
        const actionBtn = document.getElementById('action-btn');

        attempts++;

        if (selectedIndex === q.correct) {
            selectedBtn.classList.add('correct');
            disableAllOptions();

            const earnedPoints = (attempts === 1) ? 5 : 2.5;
            studentData.score += earnedPoints;
            studentData.answers.push(attempts === 1 ? "הצלחה (ניסיון 1)" : "הצלחה (ניסיון 2)");

            feedbackBox.innerText = attempts === 1 ? '🎉 נכון מאוד! כל הכבוד.' : '👍 נכון! יפה מאוד על הניסיון השני.';
            feedbackBox.className = 'feedback-box success';
            feedbackBox.style.display = 'block';

            actionBtn.innerText = (currentQuestion === questions.length - 1) ? 'סיים תרגול' : 'המשך לשאלה הבאה';
            actionBtn.style.display = 'block';

        } else {
            selectedBtn.classList.add('incorrect');
            selectedBtn.disabled = true;

            if (attempts === 1) {
                feedbackBox.innerHTML = `❌ תשובה לא נכונה.<br>${q.hint}<br><strong>נסה שוב!</strong>`;
                feedbackBox.className = 'feedback-box hint';
                feedbackBox.style.display = 'block';
            } else {
                disableAllOptions();
                studentData.answers.push("טעות");

                const correctText = q.options[q.correct];
                document.getElementById(`opt-${q.correct}`).classList.add('correct');

                feedbackBox.innerHTML = `❌ תשובה לא נכונה.<br>התשובה הנכונה היא: <strong>${correctText}</strong>`;
                feedbackBox.className = 'feedback-box hint';
                feedbackBox.style.display = 'block';

                actionBtn.innerText = (currentQuestion === questions.length - 1) ? 'סיים תרגול' : 'המשך לשאלה הבאה';
                actionBtn.style.display = 'block';
            }
        }
    }

    function disableAllOptions() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);
    }

    function handleNextStep(event) {
        if (event && event.preventDefault) {
            event.preventDefault();
        }
        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        document.getElementById('score-display').innerText = Math.round(studentData.score);

        sendDataToGoogleSheets();
    }

    function sendDataToGoogleSheets() {
        if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
            document.getElementById('status-message').innerText = 'התוצאה הוצגה! (לחיבור ל-Google Sheets יש להגדיר את הקוד בשרת)';
            document.getElementById('loader').style.display = 'none';
            return;
        }

        const payload = {
            name: studentData.name,
            class: studentData.class,
            score: Math.round(studentData.score),
            answers: studentData.answers
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('status-message').innerText = 'התוצאות נשמרו בהצלחה במערכת!';
            document.getElementById('loader').style.display = 'none';
        })
        .catch(err => {
            document.getElementById('status-message').innerText = 'אירעה שגיאה בשמירת התוצאות.';
            document.getElementById('loader').style.display = 'none';
            console.error(err);
        });
    }
</script>
</body>
</html>
